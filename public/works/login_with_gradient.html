<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业统一认证平台登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Extracting colors from the provided image reference
                        'brand-purple': '#7B61FF',
                        'brand-pink': '#FFD1DC',
                        'brand-blue': '#A3E4D7',
                        'brand-light-blue': '#E0F2FE',
                        'brand-dark': '#2D3748',
                        'brand-gray': '#718096',
                        'dingtalk-blue': '#008CE5',
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'glass-hover': '0 12px 40px 0 rgba(31, 38, 135, 0.12)',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom background mesh gradient inspired by the reference image */
        .mesh-bg {
            background-color: #f3f4f6; /* Fallback */
            background-image: 
                radial-gradient(at 0% 0%, hsla(271,83%,69%,0.4) 0px, transparent 50%),
                radial-gradient(at 40% 20%, hsla(339,100%,88%,0.5) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,56%,0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(240,65%,75%,0.4) 0px, transparent 50%),
                radial-gradient(at 0% 100%, hsla(333,100%,80%,0.3) 0px, transparent 50%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Glassmorphism styling for the login container */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7); /* Slightly more transparent */
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05); /* Softer shadow */
        }

        /* Abstract shapes styling (optional, for adding depth like the image) */
        .abstract-shape {
            position: absolute;
            z-index: 0;
            opacity: 0.6;
            animation: float 6s ease-in-out infinite;
        }

        .shape-circle {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD1DC 0%, #A3E4D7 100%);
            top: -50px;
            right: -100px;
        }
        
        .shape-pill {
            width: 150px;
            height: 350px;
            border-radius: 75px;
            background: linear-gradient(135deg, #A3E4D7 0%, #7B61FF 100%);
            bottom: -100px;
            left: -50px;
            transform: rotate(45deg);
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        
        /* Specific pill animation since it starts rotated */
        @keyframes float-pill {
            0% { transform: translateY(0px) rotate(45deg); }
            50% { transform: translateY(-20px) rotate(50deg); }
            100% { transform: translateY(0px) rotate(45deg); }
        }
        
        .shape-pill {
            animation: float-pill 8s ease-in-out infinite;
        }

        .btn-hover-effect {
            transition: all 0.3s ease;
        }
        
        .btn-hover-effect:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="mesh-bg font-sans text-brand-dark antialiased relative overflow-hidden flex items-center justify-center h-screen">

    <!-- Decorative background elements (inspired by the 3D shapes in the reference) -->
    <div class="abstract-shape shape-circle hidden lg:block"></div>
    <div class="abstract-shape shape-pill hidden lg:block"></div>

    <!-- Main Container -->
    <div class="container mx-auto px-4 relative z-10 w-full max-w-md"> <!-- Narrower max-width for centered panel -->
        <div class="glass-panel rounded-3xl flex flex-col overflow-hidden py-12 px-8 sm:px-12 relative">
            
            <!-- Custom Logo Design based on the provided image -->
            <div class="flex justify-center mb-10">
                <div class="relative w-20 h-20 bg-white rounded-2xl shadow-sm flex items-center justify-center overflow-hidden">
                    <!-- Overlapping circles -->
                    <div class="absolute w-14 h-14 rounded-full bg-blue-400/70 mix-blend-multiply top-2 left-1"></div>
                    <div class="absolute w-14 h-14 rounded-full bg-red-300/70 mix-blend-multiply bottom-2 right-1"></div>
                    <div class="absolute w-14 h-14 rounded-full bg-yellow-300/50 mix-blend-multiply bottom-2 left-2"></div>
                    
                    <!-- TT Text -->
                    <span class="relative z-10 text-white font-bold text-3xl font-sans" style="letter-spacing: 2px;">TT</span>
                </div>
            </div>

            <!-- Login Form Area -->
            <div class="w-full flex flex-col justify-center">
                <div class="w-full text-center mb-8">
                    <h2 class="text-2xl font-bold text-gray-800 mb-2 tracking-tight">企业内部系统登录</h2>
                    <p class="text-gray-500 text-sm">请选择授权方式进行身份验证</p>
                </div>

                <!-- OAuth Login Buttons Container -->
                <div class="space-y-4">
                    
                    <!-- CAS Login Button -->
                    <button onclick="handleLogin('cas')" class="btn-hover-effect w-full group relative flex items-center justify-center px-6 py-4 border border-white/60 bg-white/50 text-base font-medium rounded-2xl text-gray-700 hover:bg-white/80 hover:border-brand-purple focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-purple overflow-hidden backdrop-blur-sm transition-all duration-300 shadow-sm hover:shadow-md">
                        <!-- Subtle hover background effect -->
                        <div class="absolute inset-0 w-0 bg-gradient-to-r from-brand-purple/10 to-transparent transition-all duration-300 ease-out group-hover:w-full"></div>
                        
                        <span class="absolute left-0 inset-y-0 flex items-center pl-6">
                            <div class="w-8 h-8 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 shadow-inner">
                                <i class="fa-solid fa-shield-halved text-sm"></i>
                            </div>
                        </span>
                        <span class="relative ml-8 font-semibold tracking-wide">
                            CAS 统一认证
                        </span>
                    </button>

                    <!-- DingTalk Login Button -->
                    <button onclick="handleLogin('dingtalk')" class="btn-hover-effect w-full group relative flex items-center justify-center px-6 py-4 border border-white/60 bg-white/50 text-base font-medium rounded-2xl text-gray-700 hover:bg-white/80 hover:border-dingtalk-blue focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-dingtalk-blue overflow-hidden backdrop-blur-sm transition-all duration-300 shadow-sm hover:shadow-md">
                         <!-- Subtle hover background effect -->
                         <div class="absolute inset-0 w-0 bg-gradient-to-r from-dingtalk-blue/10 to-transparent transition-all duration-300 ease-out group-hover:w-full"></div>

                        <span class="absolute left-0 inset-y-0 flex items-center pl-6">
                            <div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-dingtalk-blue shadow-inner">
                                <svg class="w-4 h-4" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg"><path d="M495.274667 791.850667C344.405333 762.666667 232.064 631.125333 232.064 473.429333 232.064 300.928 371.84 161.024 544.170667 161.024 716.629333 161.024 856.405333 300.928 856.405333 473.429333c0 98.645333-45.738667 186.752-117.418667 244.437334-2.858667 2.304-7.253333 1.28-8.832-1.92-35.84-72.362667-111.402667-122.368-197.802666-122.368h-77.013333c-39.722667 0-71.978667 32.341333-71.978667 72.192v216.746667c0 4.693333 3.84 8.448 8.533333 8.448 3.84 0 7.338667-2.688 8.277334-6.442666a337.834667 337.834667 0 0 0 7.978666-72.789334v-115.541333h105.770667c13.781333 0 27.264 1.706667 40.234667 4.906667 61.354667 15.061333 103.936 67.882667 114.688 128.426666 0.384 2.176 2.389333 3.797333 4.565333 3.797334H653.653333c84.224 0 160.042667-35.968 213.333334-93.568 28.373333-30.634667 50.133333-67.626667 63.317333-108.672C944.597333 510.976 952.746667 492.544 952.746667 473.429333c0-225.834667-183.082667-408.874667-408.832-408.874666C318.250667 64.554667 135.253333 247.594667 135.253333 473.429333c0 205.824 152.021333 376.192 350.378667 404.949334 3.712 0.512 7.082667-2.432 7.082667-6.229334 0-1.877333-0.810667-3.669333-2.176-4.906666l-67.584-59.392c-3.114667-2.730667-7.978667-3.157333-11.477334-0.938667z" fill="currentColor"/></svg>
                            </div>
                        </span>
                        <span class="relative ml-8 font-semibold tracking-wide">
                            钉钉授权登录
                        </span>
                    </button>
                </div>

                <!-- Divider -->
                <div class="mt-8 mb-6 relative">
                    <div class="absolute inset-0 flex items-center" aria-hidden="true">
                        <div class="w-full border-t border-gray-300/50"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 text-gray-500 bg-white/70 backdrop-blur-md rounded-full text-xs tracking-wider">
                            IT DEPARTMENT
                        </span>
                    </div>
                </div>

                <!-- Bottom Info -->
                <div class="mt-4 text-center text-xs text-gray-500/80">
                    <p class="mt-1 font-mono">v 2.4.1</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Modal for Notifications (Replacing alert) -->
    <div id="notification-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="absolute inset-0 bg-gray-900/40 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4 relative transform scale-95 transition-transform duration-300" id="modal-content">
            <div class="absolute top-4 right-4">
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 focus:outline-none">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="text-center mb-6">
                <div id="modal-icon" class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-brand-light-blue text-brand-purple mb-4">
                    <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-900" id="modal-title">正在跳转</h3>
                <p class="mt-2 text-sm text-gray-500" id="modal-message">
                    正在连接至授权中心，请稍候...
                </p>
            </div>
            <div class="mt-4 flex justify-center hidden" id="modal-action">
                <button onclick="closeModal()" class="inline-flex justify-center w-full px-4 py-2 text-sm font-medium text-white bg-brand-purple border border-transparent rounded-xl hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-purple shadow-sm">
                    确认
                </button>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('notification-modal');
        const modalContent = document.getElementById('modal-content');
        
        function handleLogin(provider) {
            // Show custom modal to simulate redirect process
            showModal(provider);
            
            // Simulate API call or redirect logic
            setTimeout(() => {
                const title = document.getElementById('modal-title');
                const message = document.getElementById('modal-message');
                const icon = document.getElementById('modal-icon');
                const action = document.getElementById('modal-action');

                icon.classList.remove('fa-spin', 'bg-brand-light-blue', 'text-brand-purple');
                icon.innerHTML = '<i class="fa-solid fa-check text-2xl"></i>';
                
                if (provider === 'cas') {
                    icon.classList.add('bg-green-100', 'text-green-600');
                    title.textContent = 'CAS 准备就绪';
                    message.textContent = '在实际环境中，现在将重定向到您的 CAS 服务器 (例如: https://cas.example.com/login)。';
                } else if (provider === 'dingtalk') {
                    icon.classList.add('bg-blue-100', 'text-dingtalk-blue');
                    title.textContent = '钉钉授权准备就绪';
                    message.textContent = '在实际环境中，现在将唤起钉钉扫码或跳转至钉钉授权页面。';
                }

                action.classList.remove('hidden');
            }, 1500);
        }

        function showModal(provider) {
            // Reset modal state
            const title = document.getElementById('modal-title');
            const message = document.getElementById('modal-message');
            const icon = document.getElementById('modal-icon');
            const action = document.getElementById('modal-action');
            
            icon.className = 'mx-auto flex items-center justify-center h-16 w-16 rounded-full mb-4 bg-brand-light-blue text-brand-purple';
            icon.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-2xl"></i>';
            action.classList.add('hidden');
            
            title.textContent = '正在连接...';
            message.textContent = `准备通过 ${provider === 'cas' ? 'CAS' : '钉钉'} 进行授权登录。`;

            // Display modal with animation
            modal.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); // Match transition duration
        }
    </script>
</body>
</html>
