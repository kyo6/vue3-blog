<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="appGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="webGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="mobGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#bgGrad2)"/>

  <text x="400" y="45" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#374151">跨平台场景中的渐进式披露</text>

  <!-- Desktop App -->
  <g transform="translate(40, 80)" filter="url(#shadow2)">
    <rect x="0" y="0" width="210" height="370" rx="16" fill="#FFFFFF" stroke="#E9D5FF" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="210" height="36" rx="16" fill="url(#appGrad)"/>
    <rect x="0" y="20" width="210" height="16" fill="url(#appGrad)"/>
    <circle cx="18" cy="18" r="5" fill="#FCA5A5" opacity="0.8"/>
    <circle cx="34" cy="18" r="5" fill="#FCD34D" opacity="0.8"/>
    <circle cx="50" cy="18" r="5" fill="#86EFAC" opacity="0.8"/>
    <text x="120" y="22" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#FFFFFF" opacity="0.8">桌面应用</text>

    <!-- Menu bar -->
    <rect x="12" y="46" width="60" height="20" rx="4" fill="#F5F3FF"/>
    <text x="42" y="60" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#7C3AED">文件</text>
    <rect x="76" y="46" width="60" height="20" rx="4" fill="#F5F3FF"/>
    <text x="106" y="60" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#7C3AED">编辑</text>
    <rect x="140" y="46" width="58" height="20" rx="4" fill="#F5F3FF"/>
    <text x="169" y="60" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#7C3AED">视图</text>

    <!-- Main content area - simple view -->
    <rect x="12" y="74" width="186" height="130" rx="8" fill="#F8F7FF" stroke="#DDD6FE" stroke-width="1"/>
    <text x="105" y="130" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#8B5CF6">核心功能区</text>
    <text x="105" y="150" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#C4B5FD">常用命令 + 工具栏</text>
    <rect x="55" y="165" width="100" height="24" rx="12" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="105" y="182" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" font-weight="600" fill="#7C3AED">高级功能 ▾</text>

    <!-- Secondary panel -->
    <rect x="12" y="220" width="186" height="80" rx="8" fill="#FEFCE8" stroke="#FDE68A" stroke-width="1"/>
    <text x="105" y="250" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#A16207">次级选项面板</text>
    <text x="105" y="270" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#CA8A04">按需求展开的配置区</text>

    <!-- Bottom note -->
    <text x="105" y="350" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#9CA3AF">分层导航 · 返回主界面</text>
  </g>

  <!-- Central arrow threads -->
  <line x1="255" y1="260" x2="290" y2="260" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="255" y1="265" x2="290" y2="265" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="255" y1="270" x2="290" y2="270" stroke="#5EEAD4" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- Web/SaaS -->
  <g transform="translate(295, 80)" filter="url(#shadow2)">
    <rect x="0" y="0" width="210" height="370" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5"/>
    <!-- Browser chrome -->
    <rect x="0" y="0" width="210" height="36" rx="16" fill="url(#webGrad)"/>
    <rect x="0" y="20" width="210" height="16" fill="url(#webGrad)"/>
    <circle cx="18" cy="18" r="5" fill="#FCA5A5" opacity="0.8"/>
    <circle cx="34" cy="18" r="5" fill="#FCD34D" opacity="0.8"/>
    <circle cx="50" cy="18" r="5" fill="#86EFAC" opacity="0.8"/>
    <rect x="66" y="12" width="130" height="12" rx="6" fill="#FFFFFF" opacity="0.3"/>
    <text x="105" y="22" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#FFFFFF" opacity="0.6">Web 应用</text>

    <!-- Product card -->
    <rect x="12" y="46" width="186" height="120" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1"/>
    <rect x="24" y="58" width="100" height="8" rx="4" fill="#DBEAFE"/>
    <rect x="24" y="74" width="160" height="6" rx="3" fill="#DBEAFE"/>
    <rect x="24" y="86" width="160" height="6" rx="3" fill="#DBEAFE"/>
    <rect x="24" y="98" width="60" height="6" rx="3" fill="#DBEAFE"/>
    <rect x="24" y="118" width="80" height="28" rx="6" fill="#3B82F6"/>
    <text x="64" y="137" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">核心属性</text>
    <rect x="114" y="118" width="72" height="28" rx="6" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="150" y="137" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" font-weight="600" fill="#2563EB">完整规格 →</text>

    <!-- Breadcrumb -->
    <text x="12" y="190" font-family="PingFang SC, sans-serif" font-size="9" fill="#9CA3AF">首页 &gt; 产品 &gt; <tspan fill="#3B82F6">规格详情</tspan></text>

    <!-- Detail page -->
    <rect x="12" y="200" width="186" height="100" rx="8" fill="#FEFCE8" stroke="#FDE68A" stroke-width="1"/>
    <text x="105" y="225" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#A16207">完整规格页面</text>
    <text x="105" y="245" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#CA8A04">详细参数 · 对比 · 评测</text>
    <text x="105" y="265" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#CA8A04">仅在用户点击后展开</text>

    <!-- Hypertext note -->
    <text x="105" y="345" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#9CA3AF">超文本：高层级 → 低层级链接</text>
  </g>

  <!-- Mobile -->
  <g transform="translate(550, 80)" filter="url(#shadow2)">
    <rect x="0" y="0" width="210" height="370" rx="16" fill="#FFFFFF" stroke="#99F6E4" stroke-width="1.5"/>
    <!-- Status bar -->
    <rect x="0" y="0" width="210" height="28" rx="16" fill="url(#mobGrad)"/>
    <rect x="0" y="14" width="210" height="14" fill="url(#mobGrad)"/>
    <text x="105" y="19" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#FFFFFF" opacity="0.7">移动端 App</text>

    <!-- Nav -->
    <rect x="12" y="36" width="186" height="24" rx="4" fill="#F0FDFA"/>
    <text x="105" y="52" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#0F766E">导航栏</text>

    <!-- Card list -->
    <rect x="12" y="68" width="186" height="50" rx="6" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1"/>
    <rect x="22" y="78" width="60" height="28" rx="4" fill="#14B8A6" opacity="0.15"/>
    <rect x="90" y="80" width="98" height="6" rx="3" fill="#CCFBF1"/>
    <rect x="90" y="92" width="70" height="5" rx="2.5" fill="#CCFBF1"/>

    <rect x="12" y="126" width="186" height="50" rx="6" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="1"/>
    <rect x="22" y="136" width="60" height="28" rx="4" fill="#0D9488" opacity="0.15"/>
    <rect x="90" y="138" width="98" height="6" rx="3" fill="#CCFBF1"/>
    <rect x="90" y="150" width="70" height="5" rx="2.5" fill="#CCFBF1"/>

    <!-- More button -->
    <rect x="12" y="190" width="186" height="30" rx="15" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="105" y="210" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" font-weight="600" fill="#0D9488">查看更多选项 ▾</text>

    <!-- Expanded section -->
    <rect x="12" y="235" width="186" height="80" rx="8" fill="#FEFCE8" stroke="#FDE68A" stroke-width="1"/>
    <text x="105" y="260" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" fill="#A16207">展开的筛选/设置</text>
    <text x="105" y="280" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#CA8A04">点击后披露的次要功能</text>

    <!-- Bottom note -->
    <text x="105" y="350" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#9CA3AF">移动优先 · 推迟次要内容</text>
  </g>

  <!-- Bottom common thread -->
  <line x1="40" y1="470" x2="760" y2="470" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="400" cy="470" r="6" fill="#7C3AED" opacity="0.3"/>
  <circle cx="147" cy="470" r="4" fill="#7C3AED" opacity="0.2"/>
  <circle cx="400" cy="470" r="4" fill="#3B82F6" opacity="0.3"/>
  <circle cx="653" cy="470" r="4" fill="#0D9488" opacity="0.2"/>
</svg>
