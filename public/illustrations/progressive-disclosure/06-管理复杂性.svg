<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="bgGrad6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="shadow6" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="20" fill="url(#bgGrad6)"/>

  <text x="400" y="40" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#374151">从混乱到有序：管理界面复杂性</text>

  <!-- Left: Chaos / Ungrouped -->
  <g transform="translate(35, 70)">
    <text x="155" y="20" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#EA580C">混乱的设计</text>

    <rect x="0" y="40" width="310" height="370" rx="14" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.5" filter="url(#shadow6)"/>

    <!-- Scattered, ungrouped items -->
    <rect x="15" y="55" width="130" height="50" rx="6" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
    <text x="80" y="75" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#9A3412">高级功能 A</text>
    <text x="80" y="92" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8" fill="#EA580C">第三级选项</text>

    <rect x="160" y="45" width="135" height="55" rx="6" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
    <text x="227" y="65" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#9A3412">高级功能 B</text>
    <text x="227" y="82" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8" fill="#EA580C">第三级选项</text>

    <rect x="15" y="120" width="280" height="40" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="155" y="138" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#A16207">核心功能（混乱排列）</text>
    <text x="155" y="153" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8" fill="#CA8A04">与其他功能混在一起</text>

    <rect x="20" y="175" width="120" height="45" rx="6" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
    <text x="80" y="195" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#9A3412">专业设置</text>
    <text x="80" y="211" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8" fill="#EA580C">很少使用</text>

    <rect x="155" y="180" width="140" height="40" rx="6" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1"/>
    <text x="225" y="198" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#9A3412">更多高级功能</text>

    <rect x="15" y="235" width="180" height="40" rx="6" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>
    <text x="105" y="253" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#A16207">基础工具（被淹没）</text>

    <!-- Stress indicators -->
    <text x="155" y="305" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#EF4444">😵 用户迷失方向</text>
    <text x="155" y="325" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#9CA3AF">超过 2 级→认知过载</text>

    <!-- Too many levels indicator -->
    <rect x="50" y="340" width="210" height="28" rx="8" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1"/>
    <text x="155" y="358" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" font-weight="600" fill="#DC2626">L1 → L2 → L3 → L4 ...</text>

    <text x="155" y="390" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#9CA3AF">⚠ 3 层以上：频繁迷失</text>
  </g>

  <!-- Arrow of transformation -->
  <g transform="translate(350, 250)">
    <path d="M10 0 L50 0" stroke="#8B5CF6" stroke-width="3"/>
    <polygon points="47,-5 57,0 47,5" fill="#8B5CF6"/>
    <text x="35" y="-10" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#8B5CF6">优化</text>
  </g>

  <!-- Right: Organized / Card sorting -->
  <g transform="translate(455, 70)">
    <text x="155" y="20" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#7C3AED">有序的解决方案</text>

    <rect x="0" y="40" width="310" height="370" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5" filter="url(#shadow6)"/>

    <!-- Card Sort Group 1 -->
    <rect x="12" y="55" width="286" height="95" rx="8" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1"/>
    <rect x="12" y="55" width="286" height="28" rx="8" fill="url(#cardGrad1)"/>
    <rect x="12" y="67" width="286" height="16" fill="url(#cardGrad1)"/>
    <text x="155" y="74" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">📂 分组 A：核心功能</text>
    <rect x="22" y="93" width="88" height="22" rx="4" fill="#EDE9FE"/>
    <text x="66" y="109" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8" fill="#6D28D9">常用操作 1</text>
    <rect x="116" y="93" width="88" height="22" rx="4" fill="#EDE9FE"/>
    <text x="160" y="109" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8" fill="#6D28D9">常用操作 2</text>
    <rect x="210" y="93" width="80" height="22" rx="4" fill="#EDE9FE"/>
    <text x="250" y="109" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8" fill="#6D28D9">常用操作 3</text>
    <text x="155" y="140" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8" fill="#A78BFA">80% 用户在此完成</text>

    <!-- Card Sort Group 2 -->
    <rect x="12" y="160" width="286" height="80" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <rect x="12" y="160" width="286" height="26" rx="8" fill="url(#cardGrad2)"/>
    <rect x="12" y="172" width="286" height="14" fill="url(#cardGrad2)"/>
    <text x="155" y="178" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">📂 分组 B：高级特性</text>
    <rect x="22" y="196" width="130" height="20" rx="4" fill="#DBEAFE"/>
    <text x="87" y="210" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8" fill="#2563EB">专业功能</text>
    <rect x="158" y="196" width="130" height="20" rx="4" fill="#DBEAFE"/>
    <text x="223" y="210" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8" fill="#2563EB">按需展开</text>
    <text x="155" y="232" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8" fill="#93C5FD">15% 用户可能访问</text>

    <!-- Card Sort Group 3 -->
    <rect x="12" y="250" width="286" height="70" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1"/>
    <rect x="12" y="250" width="286" height="24" rx="8" fill="url(#cardGrad3)"/>
    <rect x="12" y="260" width="286" height="14" fill="url(#cardGrad3)"/>
    <text x="155" y="266" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">📂 分组 C：偏好设置</text>
    <rect x="22" y="284" width="266" height="18" rx="4" fill="#CCFBF1"/>
    <text x="155" y="297" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8" fill="#0F766E">个性化选项</text>
    <text x="155" y="314" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="8" fill="#5EEAD4">5% 用户关心</text>

    <!-- Success indicators -->
    <text x="155" y="350" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="11" fill="#22C55E">✓ 最多 2 个层级</text>
    <text x="155" y="370" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#9CA3AF">清晰分组 · 用户测试验证</text>

    <!-- Bottom label -->
    <rect x="40" y="386" width="230" height="20" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="0.5"/>
    <text x="155" y="400" text-anchor="middle" font-family="PingFang SC, sans-serif" font-size="9" fill="#7C3AED">卡片分类法 + 用户测试</text>
  </g>

  <!-- Bottom note -->
  <rect x="180" y="500" width="440" height="0" rx="0"/>
  <!-- Actually let's put a footer note -->
  <text x="400" y="485" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#9CA3AF">如果特性太多 → 简化设计 → 分组归类 → 用户测试验证</text>
</svg>
